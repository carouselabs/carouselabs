name: Application checks
on:
  pull_request:
  push:
    branches: [master, main]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DATABASE_URL: postgresql://audit:audit@127.0.0.1:5432/audit
      DIRECT_URL: postgresql://audit:audit@127.0.0.1:5432/audit
      NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: pk_test_Y2xlcmsuZXhhbXBsZS5jb20k
      CLERK_SECRET_KEY: sk_test_audit_placeholder
      ANTHROPIC_API_KEY: test-placeholder
      OPENAI_API_KEY: test-placeholder
      RESEND_API_KEY: re_test_placeholder
      UPSTASH_REDIS_REST_URL: https://audit.example.invalid
      UPSTASH_REDIS_REST_TOKEN: test-placeholder
      NEXT_PUBLIC_APP_URL: http://localhost:3102
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            browser-extension-comment/package-lock.json
      - run: npm ci
      - run: npx prisma generate
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      # Blocking: every package that ships to users. The full audit below also
      # covers build/dev tools; it reports a high advisory in braces <=3.0.3
      # (GHSA-vfj7-8cjw-p6xm, reached only through shadcn's CLI, the lint
      # plugin, ts-morph and Tailwind 3's build) that has no fixed release, so
      # it is shown on every run but can't block one. See STABILITY.md.
      - name: Audit shipped website dependencies (blocking)
        run: npm audit --omit=dev --audit-level=high
      - name: Audit all website dependencies, including dev tools (report only)
        run: npm audit --audit-level=high
        continue-on-error: true
      - run: npm ci --prefix browser-extension-comment
      - run: npm run test:unit --prefix browser-extension-comment
      - run: npm run build --prefix browser-extension-comment
      - run: npm run build:x --prefix browser-extension-comment
      - name: Audit shipped extension dependencies (blocking)
        run: npm audit --omit=dev --audit-level=high --prefix browser-extension-comment
      - name: Audit all extension dependencies, including dev tools (report only)
        run: npm audit --audit-level=high --prefix browser-extension-comment
        continue-on-error: true
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - name: Public browser regressions on a production build
        run: |
          npm run start -- --hostname localhost --port 3102 > server.log 2>&1 &
          for attempt in $(seq 1 30); do curl -fsS http://localhost:3102/terms > /dev/null && break; sleep 1; done
          npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-failures
          path: |
            test-results/
            playwright-report/
            server.log
