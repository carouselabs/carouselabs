<!doctype html>
<!--
  Fixture: /messaging/thread/2-group/ — a GROUP conversation (self + two
  others). Same CONFIRMED pieces as messaging-thread.html; the group title
  markup is APPROXIMATED (LinkedIn shows a comma-separated participant list).
-->
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Messaging | LinkedIn</title>
</head>
<body>
  <header id="global-nav" aria-label="Global Navigation">
    <nav><button aria-label="Me"><img alt="Anant Goyal" src="data:," /></button></nav>
  </header>
  <main>
    <section class="msg-convo-wrapper">
      <div class="msg-entity-lockup">
        <h2 class="msg-entity-lockup__entity-title">Priya Shah, Tom Brook</h2>
      </div>
      <ul class="msg-s-message-list-content">
        <li>
          <div class="msg-s-message-group__meta">
            <a href="https://www.linkedin.com/in/ACoAAPriya000/"><span>Priya Shah</span></a>
            <time class="msg-s-message-group__timestamp">10:00 AM</time>
          </div>
          <p class="msg-s-event-listitem__body">Welcome both — Tom, meet Anant.</p>
        </li>
        <li>
          <div class="msg-s-message-group__meta">
            <a href="https://www.linkedin.com/in/ACoAATom000/"><span>Tom Brook</span></a>
            <time class="msg-s-message-group__timestamp">10:05 AM</time>
          </div>
          <p class="msg-s-event-listitem__body">Great to meet you. What are you working on?</p>
        </li>
        <li>
          <div class="msg-s-message-group__meta">
            <a href="https://www.linkedin.com/in/ACoAAAnant000/"><span>Anant Goyal</span></a>
            <time class="msg-s-message-group__timestamp">10:07 AM</time>
          </div>
          <p class="msg-s-event-listitem__body">Thanks Priya! Building a LinkedIn writing tool.</p>
        </li>
      </ul>
      <div class="msg-form__contenteditable" contenteditable="true" role="textbox" aria-label="Write a message…"><p><br /></p></div>
    </section>
  </main>
</body>
</html>
