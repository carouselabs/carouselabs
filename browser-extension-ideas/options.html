<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>CarouseLabs Ideas Board — Settings</title>
    <style>
      body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        max-width: 420px;
        margin: 40px auto;
        color: #0a0a0a;
      }
      h1 {
        font-size: 16px;
      }
      p {
        font-size: 13px;
        color: #6b7280;
        line-height: 1.6;
      }
      label {
        display: block;
        font-size: 11px;
        font-weight: 600;
        text-transform: uppercase;
        color: #9ca3af;
        margin: 16px 0 4px;
      }
      input {
        width: 100%;
        box-sizing: border-box;
        padding: 8px 10px;
        border: 1px solid #e5e3de;
        border-radius: 8px;
        font-size: 13px;
      }
      button {
        margin-top: 16px;
        padding: 8px 16px;
        border: none;
        border-radius: 8px;
        background: #7c3aed;
        color: white;
        font-size: 13px;
        font-weight: 600;
        cursor: pointer;
      }
      #status {
        margin-top: 10px;
        font-size: 12px;
        color: #10b981;
      }
    </style>
  </head>
  <body>
    <h1>Connect CarouseLabs Ideas Board</h1>
    <p>
      Get your extension key from Settings &gt; Extension in CarouseLabs, then paste it below.
    </p>
    <label for="apiKey">Extension key</label>
    <input id="apiKey" type="password" placeholder="cl_ext_..." autocomplete="off" />
    <label for="apiBase">CarouseLabs URL (only change this for local development)</label>
    <input id="apiBase" type="text" placeholder="https://carouselabs.com" />
    <button id="save">Save</button>
    <div id="status"></div>
    <script src="options.js"></script>
  </body>
</html>
