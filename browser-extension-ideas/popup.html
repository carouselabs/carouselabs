<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>CarouseLabs Ideas Board</title>
    <style>
      body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        width: 260px;
        padding: 16px;
        margin: 0;
        color: #0a0a0a;
      }
      h1 {
        font-size: 13px;
        font-weight: 700;
        margin: 0 0 8px;
      }
      p {
        font-size: 12px;
        color: #6b7280;
        line-height: 1.5;
        margin: 0 0 12px;
      }
      .status {
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 10px;
        border-radius: 10px;
        background: #f4f2ec;
        margin-bottom: 10px;
      }
      .dot {
        width: 8px;
        height: 8px;
        border-radius: 50%;
        flex-shrink: 0;
        background: #f59e0b;
      }
      .dot.ok {
        background: #10b981;
      }
      a.button {
        display: block;
        text-align: center;
        padding: 8px 12px;
        border-radius: 8px;
        background: #7c3aed;
        color: white;
        text-decoration: none;
        font-size: 12.5px;
        font-weight: 600;
      }
      a.link {
        display: block;
        text-align: center;
        margin-top: 8px;
        font-size: 11.5px;
        color: #7c3aed;
        text-decoration: none;
      }
    </style>
  </head>
  <body>
    <h1>CarouseLabs Ideas Board</h1>
    <div id="status" class="status">
      <span id="dot" class="dot"></span>
      <span id="statusText">Checking…</span>
    </div>
    <p>Right-click any image, link, or selected text on the web, then choose "Save to CarouseLabs Ideas Board."</p>
    <a id="optionsLink" class="button" href="#">Connect your account</a>
    <a class="link" id="boardLink" href="#" target="_blank">Open Ideas Board →</a>
    <script src="popup.js"></script>
  </body>
</html>
